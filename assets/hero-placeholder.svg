<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1236" />
      <stop offset="50%" stop-color="#4a154b" />
      <stop offset="100%" stop-color="#190d28" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff7eb3" stop-opacity="0.2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#heroBg)" />
  
  <!-- Ambient circles -->
  <circle cx="150" cy="150" r="140" fill="#ff758c" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="450" cy="450" r="160" fill="#ffd166" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="300" cy="300" r="190" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Center Card Frame -->
  <rect x="130" y="110" width="340" height="380" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ff758c" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Crown / Star Decoration -->
  <g transform="translate(300, 190) scale(1.3)">
    <path d="M0 -30 L8 -10 L30 -8 L14 8 L18 30 L0 18 L-18 30 L-14 8 L-30 -8 L-8 -10 Z" fill="#ffd166" />
    <circle cx="0" cy="0" r="6" fill="#fff" />
  </g>

  <!-- Heart & Camera Icon -->
  <g transform="translate(300, 275)">
    <circle cx="0" cy="0" r="46" fill="#ff758c" fill-opacity="0.2" />
    <path d="M-22 -10 C-32 -25 -5 -35 0 -12 C5 -35 32 -25 22 -10 C10 8 0 20 0 20 C0 20 -10 8 -22 -10 Z" fill="#ff758c" />
    <circle cx="0" cy="-2" r="6" fill="#fff" />
  </g>

  <!-- Text -->
  <text x="300" y="365" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    HER PHOTO PLACEHOLDER
  </text>
  <text x="300" y="395" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#ffb4c8" text-anchor="middle">
    Drop photo into: assets/hero.png
  </text>
  <text x="300" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#e0c3fc" fill-opacity="0.7" text-anchor="middle">
    Recommended: 600 x 600px (Portrait / Square)
  </text>

  <!-- Sparkles -->
  <circle cx="180" cy="180" r="3" fill="#fff" opacity="0.8" />
  <circle cx="420" cy="170" r="4" fill="#ffd166" opacity="0.9" />
  <circle cx="160" cy="420" r="3" fill="#ff758c" opacity="0.8" />
  <circle cx="440" cy="400" r="2" fill="#fff" opacity="0.8" />
</svg>
